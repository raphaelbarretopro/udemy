name: Manter curtidas ativas
# O plano gratuito do Supabase pausa o projeto depois de 7 dias sem uso.
# Esta tarefa consulta os contadores duas vezes por semana para mantê-lo ativo.
# Ela lê o endereço e a chave pública de site/assets/dados.js (window.SOCIAL).
on:
  schedule:
    - cron: "17 12 * * 1,4"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Consultar o Supabase
        run: |
          URL=$(sed -n 's/.*supabaseUrl: *"\([^"]*\)".*/\1/p' site/assets/dados.js | head -1)
          CHAVE=$(sed -n 's/.*chavePublica: *"\([^"]*\)".*/\1/p' site/assets/dados.js | head -1)
          if [ -z "$URL" ] || [ -z "$CHAVE" ]; then echo "Supabase ainda não configurado: nada a fazer."; exit 0; fi
          curl -fsS -X POST "$URL/rest/v1/rpc/contagens" -H "apikey: $CHAVE" -H "Content-Type: application/json" -d '{}' -o /dev/null
          echo "Supabase ativo."
